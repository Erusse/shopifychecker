<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Reset Budget Helper</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#0f172a;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 40px));background:white;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 18px 50px #0f172a12;text-align:center}.spin{width:34px;height:34px;border:4px solid #e5e7eb;border-top-color:#0f172a;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{color:#64748b;font-size:14px;line-height:1.5}</style></head><body><div class="card"><div class="spin"></div><h1>Sto aggiornando Budget Helper</h1><p id="msg">Rimuovo la vecchia cache e riapro l'app aggiornata…</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}localStorage.setItem('budgetHelperLastCacheReset',new Date().toISOString());document.getElementById('msg').textContent='Cache rimossa. Riapro la versione aggiornata…';setTimeout(()=>location.replace('./?fresh=41-'+Date.now()),700)}catch(e){document.getElementById('msg').textContent='Reset completato parzialmente. Riapro comunque l’app…';setTimeout(()=>location.replace('./?fresh=41-'+Date.now()),1000)}})();</script></body></html>
